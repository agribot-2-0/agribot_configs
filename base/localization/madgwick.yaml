imu_filter_madgwick:
  # General settings
  world_frame: enu # East-North-Up convention accroding to REP-103
  use_mag: true
  use_magnetic_field_msg: true
  publish_debug_topics: false
  publish_tf: false

  # Filter gains
  gain: 0.1
  zeta: 0.01

  # Noise settings
  mag_bias_x: 0.0
  mag_bias_y: 0.0
  mag_bias_z: 0.0
  orientation_stddev: 0.01
