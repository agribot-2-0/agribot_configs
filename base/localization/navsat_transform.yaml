# Time to wait before calculating the transform
delay: 2.0

# IMU correction
magnetic_declination_radians: 0.0 # Declination correction is handled in imu_declination_correction_node
yaw_offset: 0.0 # IMU reads 0 facing east

# Data configuration
zero_altitude: true
use_odometry_yaw: false
wait_for_datum: false

# [utm -> map] TF publication
broadcast_cartesian_transform_as_parent_frame: false
use_local_cartesian: false

# Filtered GPS publication
publish_filtered_gps: true
frequency: 30
