robot_base_frame: base_footprint

footprint: [[-2.5, -0.75], [-2.5, 0.75], [2.5, 0.75], [2.5, -0.75]]
obstacle_range: 9.0
raytrace_range: 15.0

plugins: 
  - {name: obstacles_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

static_layer:
  map_topic: /map

obstacles_layer:
  enabled: true
  observation_sources: laser_scan
  obstacle_range: 10.0
  laser_scan:
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    inf_is_valid: true


inflation_layer:
  enabled: true
  inflation_radius: 0.5
  cost_scaling_factor: 10.0
