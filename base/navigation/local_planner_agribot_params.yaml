AgribotPlannerROS:
  reference_frame_id: "base_footprint"
  obstacle_frame_id: "base_footprint"

  epsilon: 1e-3                       # unitless

  chassis_length: 2.1                 # metres
  max_linear_vel: 0.3                 # m/s
  min_linear_vel: 0.1                 # m/s
  min_radius: 3.0                     # metres
  dead_zone: 3.0                      # degrees

  deviation_weight_straight: 0.6      # factor
  parallelness_weight_straight: 10.0  # factor
  deviation_weight_arc: 50.0         # factor
  parallelness_weight_arc: 100.3     # factor

  goal_distance_tolerance: 0.5        # metres
  goal_range: 0.3                     # factor
  missed_points_tolerance: 10000     # n

  prediction_time: 60                 # seconds
  prediction_points_per_second: 2     # n/second

  design_dead_zone: 0.0               # degrees
  design_arc_radius: 4.0             # metres
  design_step_size: 0.5               # metres

  hermite_magnitude: 10.0             # factor

  odom_filter_time: 0.1               # seconds
  missed_distance_coefficient: 1.1    # factor >1

  arc_approach: false
  speed_limit: true
  debug: false
  statistics: true
  take_front: false

  costmap_converter_plugin: costmap_converter::CostmapToPolygonsDBSMCCH
  costmap_converter_odom_topic: /odom
  costmap_converter_spin_thread: True
  costmap_converter_rate: 5
